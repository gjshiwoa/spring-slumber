# ChunMian shaderpack configuration
# Reference: https://shaders.properties/

# Disable engine blending only for entry programs that perform full-pixel writes.
# terrain/block/hand/entities write packed opaque gbuffer data.
# basic and beaconbeam perform manual composition in the shader.
# Forward translucent programs retain engine blending and are intentionally omitted.
blend.gbuffers_terrain    = off
blend.gbuffers_block      = off
blend.gbuffers_hand       = off
blend.gbuffers_entities   = off
blend.gbuffers_basic      = off
blend.gbuffers_beaconbeam = off

# Shadow writes shadowcolor0 as full-pixel transmission albedo; cutout is handled manually.
blend.shadow              = off
