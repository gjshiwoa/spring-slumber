# per-buffer blend (Chun v2 format): program-level off + blend.<program>.colortex6 alpha blend.
# See AGENTS.md for rationale. ASCII only - Iris preprocesses properties files.
blend.gbuffers_terrain             = off
blend.gbuffers_block               = off
blend.gbuffers_block_translucent   = off
blend.gbuffers_hand                = off
blend.gbuffers_entities            = off
blend.gbuffers_entities.colortex6  = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_entities_translucent        = off
blend.gbuffers_entities_translucent.colortex6 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_basic               = off
blend.gbuffers_line                = off
blend.gbuffers_beaconbeam          = off
# spidereyes / armor_glint: vanilla draws these as additive overlays (eyes srcAlpha/ONE, glint
# SRC_COLOR/ONE); the packed manual composite in gbuffers_color_textured (macro
# MANUAL_COMPOSITE_ADDITIVE) needs blending off and rebuilds the additive response in-shader.
# See AGENTS.md.
blend.gbuffers_armor_glint         = off
blend.gbuffers_spidereyes          = off
blend.gbuffers_textured                    = off
blend.gbuffers_textured.colortex6          = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_textured_lit                = off
blend.gbuffers_textured_lit.colortex6      = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_particles                   = off
blend.gbuffers_particles.colortex6         = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_particles_translucent       = off
blend.gbuffers_particles_translucent.colortex6 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_lightning                   = off
blend.gbuffers_lightning.colortex6         = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
# Water family (water / hand_water / weather): blend directives intentionally removed (kept
# commented below for reference). These passes always run AFTER deferred, so the engine's default
# translucent alpha blend (SRC_ALPHA / ONE_MINUS_SRC_ALPHA) is exactly the wanted state - the
# explicit "off + colortex6" pair only duplicated it, and program-level off would kill blending
# outright on builds without per-buffer blend support. See AGENTS.md.
# blend.gbuffers_water                       = off
# blend.gbuffers_water.colortex6             = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
# blend.gbuffers_hand_water                  = off
# blend.gbuffers_hand_water.colortex6        = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
# blend.gbuffers_weather                     = off
# blend.gbuffers_weather.colortex6           = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE

blend.shadow              = off

# Alpha test: engine-side test is disabled for every gbuffer program (and shadow) on all
# versions. The packed colortex4/5 alpha channels (specular map / material ID) must never be
# alpha-tested by the engine; cutout is done in-shader via CUTOUT_REF (see constants.glsl) =
# the alphaTestRef uniform clamped to [0.1, 1.0]. Iris maps off -> ALWAYS and feeds the
# uniform 0.0; legacy OptiFine leaves it unbound at 0.0; both fall back to the 0.1 floor.
# Modern OptiFine keeps feeding its per-draw reference, which passes through. See AGENTS.md.
alphaTest.gbuffers_terrain                = off
alphaTest.gbuffers_terrain_solid          = off
alphaTest.gbuffers_terrain_cutout         = off
alphaTest.gbuffers_terrain_cutout_mip     = off
alphaTest.gbuffers_block                  = off
alphaTest.gbuffers_block_translucent      = off
alphaTest.gbuffers_entities               = off
alphaTest.gbuffers_entities_translucent   = off
alphaTest.gbuffers_entities_glowing       = off
alphaTest.gbuffers_hand                   = off
alphaTest.gbuffers_basic                  = off
alphaTest.gbuffers_line                   = off
alphaTest.gbuffers_beaconbeam             = off
alphaTest.gbuffers_textured               = off
alphaTest.gbuffers_textured_lit           = off
alphaTest.gbuffers_particles              = off
alphaTest.gbuffers_particles_translucent  = off
alphaTest.gbuffers_lightning              = off
alphaTest.gbuffers_water                  = off
alphaTest.gbuffers_hand_water             = off
alphaTest.gbuffers_weather                = off
alphaTest.gbuffers_skybasic               = off
alphaTest.gbuffers_skytextured            = off
alphaTest.gbuffers_clouds                 = off
alphaTest.gbuffers_armor_glint            = off
alphaTest.gbuffers_spidereyes             = off
alphaTest.gbuffers_damagedblock           = off
alphaTest.shadow                          = off

# Engine feature toggles (migrated from Chun v2). Vanilla celestial geometry and screen
# overlays are skipped at the engine level: this pack draws its own sun/moon disks, star
# field and 2D planar clouds in deferred_init, its own underwater fog in composite_fog,
# and its own directional lighting in shadeSurface. oldLighting must be false so the
# vanilla fixed-function side shading baked into gl_Color does not double-darken the
# terrain albedo. separateAo stays false: AO remains premultiplied into gl_Color.rgb
# (albedo = texture * vColor). dhShadow is Iris-only (no Distant Horizons support);
# legacy OptiFine ignores unknown keys. See AGENTS.md for rationale.
sun = false
moon = false
stars = false
clouds = off
oldLighting = false
oldHandLight = false
separateAo = false
underwaterOverlay = false
vignette = false
dhShadow.enabled = false

screen = [SHADOWS] [ATMOSPHERE] [WATER] [POST] [WORLD]

screen.SHADOWS = shadowMapResolution shadowDistance sunPathRotation ambientOcclusionLevel SHADOW_SCREEN_SPACE SHADOW_SS_STRENGTH DIRECT_SPECULAR DIRECT_SPECULAR_STRENGTH VEGETATION_SSS_STRENGTH

screen.ATMOSPHERE = CLOUDS_2D CLOUDS_2D_COVERAGE CLOUDS_2D_BRIGHTNESS SUN_DISK_RADIUS SUN_DISK_BRIGHTNESS MOON_DISK MOON_DISK_BRIGHTNESS STARS STARS_BRIGHTNESS STARS_DENSITY AERIAL_PERSPECTIVE AERIAL_DIST_SCALE BOUNDARY_FOG

screen.WATER = WAVE_HEIGHT WAVE_ROUGHNESS_MASK WAVE_GRAZE_FADE WAVE_GRAZE_STRENGTH WAVE_PARALLAX WATER_REFRACTION_STRENGTH WATER_GLINT_BRIGHTNESS WATER_FOG WATER_UW_VISIBILITY WATER_CAUSTICS WATER_CAUSTICS_BOOST WET_SURFACE

screen.POST = TAAU RENDER_SCALE RCAS RCAS_SHARPNESS RCAS_DENOISE BLOOM_STRENGTH TONEMAP COLOR_BRIGHTNESS COLOR_CONTRAST COLOR_SATURATION AUTO_EXPOSURE_BASE_LUMINANCE

screen.WORLD = WAVING_PLANTS WAVING_SHORT_AMPLITUDE WAVING_TALL_AMPLITUDE WAVING_LEAVES_AMPLITUDE

sliders = shadowMapResolution shadowDistance sunPathRotation ambientOcclusionLevel SHADOW_SS_STRENGTH DIRECT_SPECULAR_STRENGTH VEGETATION_SSS_STRENGTH CLOUDS_2D_COVERAGE CLOUDS_2D_BRIGHTNESS SUN_DISK_RADIUS SUN_DISK_BRIGHTNESS MOON_DISK_BRIGHTNESS STARS_BRIGHTNESS STARS_DENSITY AERIAL_DIST_SCALE WAVE_HEIGHT WAVE_GRAZE_STRENGTH WATER_REFRACTION_STRENGTH WATER_GLINT_BRIGHTNESS WATER_UW_VISIBILITY WATER_CAUSTICS_BOOST RENDER_SCALE RCAS_SHARPNESS BLOOM_STRENGTH COLOR_BRIGHTNESS COLOR_CONTRAST COLOR_SATURATION AUTO_EXPOSURE_BASE_LUMINANCE WAVING_SHORT_AMPLITUDE WAVING_TALL_AMPLITUDE WAVING_LEAVES_AMPLITUDE


