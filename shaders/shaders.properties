# 春眠 shaderpack 配置
# 文档: https://shaders.properties/

# 引擎混合控制：只对项目已存在的入口直接关闭（blend.<program> = off，不改 colortex 写法）
#   - terrain / block / hand / entities：写打包 gbuffer 的不透明阶段，整像素覆盖写入
#   - basic：gbuffers_color 手动合成类，着色器内已合成，引擎混合须关
#   - beaconbeam：gbuffers_beacon 信标光柱，核心整像素写 gbuffer + 外壳手动合成，引擎混合须关
# 保留引擎混合（不列出）：water / hand_water（前向半透明完整 / 简单处理）、weather、
# textured / textured_lit；line / particles / lightning 无入口，沿回退链落到 basic / textured / textured_lit
# 未创建的拆分入口（terrain_solid/cutout、*_translucent 等）不列
blend.gbuffers_terrain    = off
blend.gbuffers_block      = off
blend.gbuffers_hand       = off
blend.gbuffers_entities   = off
blend.gbuffers_basic      = off
blend.gbuffers_beaconbeam = off
