# ChunMian shaderpack configuration
# Reference: https://shaders.properties/

# Disable engine blending only for entry programs that perform full-pixel writes.
# terrain/block/hand/entities write packed opaque gbuffer data.
# basic and beaconbeam perform manual composition in the shader.
# Translucent stages guaranteed to run after deferred (water / hand_water / weather —
# the FORWARD_HW_BLEND entries with single-attachment DRAWBUFFERS:6) KEEP engine alpha
# blending: the ROP composites overlapping translucent fragments of one draw call
# atomically in submission order, while in-shader fetch+mix read-modify-write races
# there (overlapping rain streaks flickered). Timing-ambiguous textured-family stages
# write packed gbuffer data before deferred and composite manually afterwards —
# blending off for them and their fallback chain stage names (Iris matches blend config
# by stage name and does not inherit along fallback; OptiFine ignores unknown names).
blend.gbuffers_terrain             = off
blend.gbuffers_block               = off
blend.gbuffers_hand                = off
blend.gbuffers_entities            = off
blend.gbuffers_basic               = off
blend.gbuffers_beaconbeam          = off
blend.gbuffers_textured            = off
blend.gbuffers_textured_lit        = off
blend.gbuffers_particles           = off
blend.gbuffers_particles_translucent = off
blend.gbuffers_lightning           = off

# Shadow writes shadowcolor0 as full-pixel transmission albedo; cutout is handled manually.
blend.shadow              = off
