# ChunMian shaderpack block.properties
# 自定义方块 ID（mc_Entity.x：gbuffers_terrain / water 与 shadow 的 vsh 可读，未定义方块 = -1；
# 读取端见 program/gbuffers_opaque.glsl 的 vsh 段——显式标记写入 colortex4 打包 albedo 的 a 通道）
#
# ID 数值须与 lib/common/globals/constants.glsl 的 BLOCK_* 常量成对维护
#（properties 与 GLSL 无法互相引用，增改两端同步）；取值对齐 OptiFine 有符号 16 位，自定义段从 10001 起

# 草方块 → MATERIAL_SOLID：显式退出植被判定（顶面生物群系染色会被 gsh 的 chroma 判据误标），SSS 强度取 0
block.10001=minecraft:grass_block
